theme = "onedark"

[editor]
line-number = "relative"
mouse = false

[editor.cursor-shape]
insert = "bar"

[editor.search]
smart-case = false

[keys.normal.'ő']
d = "goto_prev_diag"
D = "goto_first_diag"
g = "goto_prev_change"
G = "goto_first_change"
f = "goto_prev_function"
t = "goto_prev_class"
a = "goto_prev_parameter"
c = "goto_prev_comment"
e = "goto_prev_entry"
T = "goto_prev_test"
p = "goto_prev_paragraph"
space = "add_newline_above"

[keys.normal.'ú']
d = "goto_next_diag"
D = "goto_last_diag"
g = "goto_next_change"
G = "goto_last_change"
f = "goto_next_function"
t = "goto_next_class"
a = "goto_next_parameter"
c = "goto_next_comment"
e = "goto_next_entry"
T = "goto_next_test"
p = "goto_next_paragraph"
space = "add_newline_below"


